<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LINE Trip Planner</title>
    <meta
      name="description"
      content="LINEで共有しやすい旅行予定とTODO管理のMVP"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <div>
          <p class="eyebrow">Trip planning for LINE</p>
          <h1 id="app-title">旅行予定とTODO</h1>
          <p class="lead">
            日程、予約、持ち物、担当タスクをひとつにまとめてLINEで共有できます。
          </p>
        </div>
        <div class="profile" id="profile">
          <span class="avatar" id="avatar">旅</span>
          <span>
            <span id="profile-name">ゲスト</span>
            <span class="sync-status" id="sync-status">端末保存</span>
          </span>
        </div>
      </section>

      <section class="panel trip-panel" aria-label="旅行情報">
        <label>
          旅行名
          <input id="trip-name" type="text" autocomplete="off" />
        </label>
        <div class="field-grid">
          <label>
            開始日
            <input id="trip-start" type="date" />
          </label>
          <label>
            終了日
            <input id="trip-end" type="date" />
          </label>
        </div>
        <label>
          メモ
          <textarea id="trip-note" rows="3"></textarea>
        </label>
      </section>

      <section class="stats" aria-label="進捗">
        <div>
          <span class="stat-value" id="task-progress">0%</span>
          <span class="stat-label">TODO進捗</span>
        </div>
        <div>
          <span class="stat-value" id="schedule-count">0</span>
          <span class="stat-label">予定</span>
        </div>
        <div>
          <span class="stat-value" id="task-count">0</span>
          <span class="stat-label">TODO</span>
        </div>
      </section>

      <section class="section-grid">
        <section class="panel" aria-labelledby="schedule-title">
          <div class="section-header">
            <h2 id="schedule-title">旅程</h2>
          </div>
          <form id="schedule-form" class="entry-form">
            <div class="field-grid">
              <label>
                日付
                <input id="schedule-date" type="date" required />
              </label>
              <label>
                時刻
                <input id="schedule-time" type="time" />
              </label>
            </div>
            <label>
              予定
              <input id="schedule-title-input" type="text" required />
            </label>
            <label>
              場所・URL・メモ
              <textarea id="schedule-memo" rows="2"></textarea>
            </label>
            <button type="submit">予定を追加</button>
          </form>
          <div id="schedule-list" class="list"></div>
        </section>

        <section class="panel" aria-labelledby="todo-title">
          <div class="section-header">
            <h2 id="todo-title">TODO</h2>
          </div>
          <form id="todo-form" class="entry-form">
            <label>
              タスク
              <input id="todo-title-input" type="text" required />
            </label>
            <div class="field-grid">
              <label>
                担当
                <input id="todo-owner" type="text" />
              </label>
              <label>
                期限
                <input id="todo-due" type="date" />
              </label>
            </div>
            <button type="submit">TODOを追加</button>
          </form>
          <div id="todo-list" class="list"></div>
        </section>
      </section>

      <section class="actions" aria-label="操作">
        <button id="share-line" type="button">LINEで共有</button>
        <button id="copy-summary" type="button" class="secondary">概要をコピー</button>
        <button id="export-json" type="button" class="secondary">JSONバックアップ</button>
        <label class="import-button secondary">
          JSON復元
          <input id="import-json" type="file" accept="application/json" />
        </label>
      </section>

      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>

    <template id="schedule-item-template">
      <article class="item">
        <div>
          <p class="item-title"></p>
          <p class="item-meta"></p>
          <p class="item-note"></p>
        </div>
        <button class="icon-button delete" type="button" aria-label="予定を削除">
          削除
        </button>
      </article>
    </template>

    <template id="todo-item-template">
      <article class="item todo-item">
        <label class="check-row">
          <input class="todo-check" type="checkbox" />
          <span>
            <span class="item-title"></span>
            <span class="item-meta"></span>
          </span>
        </label>
        <button class="icon-button delete" type="button" aria-label="TODOを削除">
          削除
        </button>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
